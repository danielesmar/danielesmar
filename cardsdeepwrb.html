<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Tarjeta de Cliente</title>
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* Reset y estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Contenedor de la card */
    .card-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* Tarjeta principal */
    .client-card {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.25),
                  0 8px 24px -6px rgba(0, 0, 0, 0.05);
      padding: 24px 22px 20px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .client-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 48px -16px rgba(0, 40, 60, 0.3);
    }

    /* Encabezado: avatar + nombre + código */
    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f4f8;
    }

    .avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4a90d9, #357abd);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      flex-shrink: 0;
      box-shadow: 0 6px 12px rgba(53, 122, 189, 0.25);
    }

    .client-name {
      flex: 1;
    }

    .client-name h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a2b3c;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .client-code {
      font-size: 0.8rem;
      font-weight: 500;
      color: #6b7f8f;
      background: #eef3f7;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    /* Cuerpo de la card: lista de datos */
    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 12px;
      background: #f8fafc;
      border-radius: 16px;
      transition: background 0.15s ease;
    }

    .info-item:hover {
      background: #f0f5fa;
    }

    .info-item i {
      width: 22px;
      font-size: 1.1rem;
      color: #4a90d9;
      text-align: center;
      flex-shrink: 0;
    }

    .info-item .label {
      font-weight: 500;
      color: #3d5567;
      min-width: 70px;
      font-size: 0.9rem;
    }

    .info-item .value {
      font-weight: 500;
      color: #0b1a26;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .info-item .value.phone {
      font-family: 'SF Mono', 'Roboto Mono', monospace;
      letter-spacing: 0.5px;
    }

    /* Pie de la card: botón */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-details {
      background: linear-gradient(135deg, #4a90d9, #357abd);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 40px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 6px 14px rgba(53, 122, 189, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.3px;
    }

    .btn-details i {
      font-size: 1rem;
      transition: transform 0.25s ease;
    }

    .btn-details:hover {
      background: linear-gradient(135deg, #3a7fc9, #2a6aa8);
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(53, 122, 189, 0.4);
    }

    .btn-details:active {
      transform: scale(0.97);
    }

    /* Modal (superpuesto) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 25, 40, 0.6);
      backdrop-filter: blur(6px);
      display: none; /* oculto por defecto */
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 32px;
      max-width: 400px;
      width: 100%;
      padding: 32px 28px 28px;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.35s ease;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a2b3c;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #7a8f9f;
      transition: color 0.15s ease, transform 0.15s ease;
      padding: 0 6px;
    }

    .modal-close:hover {
      color: #1a2b3c;
      transform: rotate(90deg);
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-body .info-item {
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 18px;
    }

    .modal-body .info-item .label {
      min-width: 80px;
    }

    .modal-body .info-item .value {
      font-weight: 600;
    }

    /* Animaciones */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Ajustes móviles */
    @media (max-width: 480px) {
      .client-card {
        padding: 20px 16px 18px;
        border-radius: 28px;
      }

      .avatar {
        width: 54px;
        height: 54px;
        font-size: 22px;
      }

      .client-name h2 {
        font-size: 1.1rem;
      }

      .info-item {
        padding: 6px 10px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .info-item .label {
        min-width: 60px;
        font-size: 0.8rem;
      }

      .info-item .value {
        font-size: 0.85rem;
      }

      .btn-details {
        width: 100%;
        justify-content: center;
        padding: 14px;
        font-size: 0.9rem;
      }

      .modal-card {
        padding: 24px 18px 20px;
        margin: 12px;
      }

      .modal-body .info-item {
        padding: 10px 12px;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 380px) {
      .card-header {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
      }

      .client-name {
        flex: 1 1 100%;
        text-align: center;
      }

      .info-item .label {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card-container">
    <!-- Tarjeta del cliente -->
    <div class="client-card">
      <!-- Encabezado -->
      <div class="card-header">
        <div class="avatar">JD</div>
        <div class="client-name">
          <h2>Juan Delgado</h2>
          <span class="client-code"><i class="fas fa-id-badge" style="margin-right: 5px;"></i> C-1024</span>
        </div>
      </div>

      <!-- Cuerpo con datos -->
      <div class="card-body">
        <div class="info-item">
          <i class="fas fa-id-card"></i>
          <span class="label">Cédula</span>
          <span class="value">V-12.345.678</span>
        </div>
        <div class="info-item">
          <i class="fas fa-map-pin"></i>
          <span class="label">Dirección</span>
          <span class="value">Calle 42 #5-23, Bogotá</span>
        </div>
        <div class="info-item">
          <i class="fas fa-phone-alt"></i>
          <span class="label">Teléfono</span>
          <span class="value phone">+57 310 555 1234</span>
        </div>
      </div>

      <!-- Pie: botón -->
      <div class="card-footer">
        <button class="btn-details" id="openModalBtn">
          <i class="fas fa-chevron-circle-right"></i> Ver detalles
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de detalles -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fas fa-user-circle" style="color: #4a90d9; margin-right: 8px;"></i>Detalles</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="info-item">
          <i class="fas fa-user"></i>
          <span class="label">Nombre</span>
          <span class="value">Juan Delgado</span>
        </div>
        <div class="info-item">
          <i class="fas fa-hashtag"></i>
          <span class="label">Código</span>
          <span class="value">C-1024</span>
        </div>
        <div class="info-item">
          <i class="fas fa-id-card"></i>
          <span class="label">Cédula</span>
          <span class="value">V-12.345.678</span>
        </div>
        <div class="info-item">
          <i class="fas fa-map-pin"></i>
          <span class="label">Dirección</span>
          <span class="value">Calle 42 #5-23, Bogotá</span>
        </div>
        <div class="info-item">
          <i class="fas fa-phone-alt"></i>
          <span class="label">Teléfono</span>
          <span class="value phone">+57 310 555 1234</span>
        </div>
        <!-- Información adicional opcional -->
        <div class="info-item" style="background: #eaf3fa; border-left: 4px solid #4a90d9;">
          <i class="fas fa-calendar-alt"></i>
          <span class="label">Cliente desde</span>
          <span class="value">15/03/2021</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const openBtn = document.getElementById('openModalBtn');
      const modal = document.getElementById('detailsModal');
      const closeBtn = document.getElementById('closeModalBtn');

      // Abrir modal
      openBtn.addEventListener('click', function(e) {
        e.preventDefault();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // evitar scroll
      });

      // Cerrar modal con botón X
      closeBtn.addEventListener('click', function() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
      });

      // Cerrar modal al hacer clic en el overlay (fondo)
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          modal.classList.remove('active');
          document.body.style.overflow = '';
        }
      });

      // Cerrar con tecla ESC
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          modal.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    })();
  </script>
</body>
</html>
