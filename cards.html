<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Cliente PWA</title>
    <style>
        /* Variables de diseño (Fácil de personalizar) */
        :root {
            --bg-global: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-global);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Contenedor de la Tarjeta */
        .client-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 360px; /* Tamaño ideal para móviles */
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        /* Efecto feedback visual en desktop o al mantener presionado */
        @media (hover: hover) {
            .client-card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-hover);
            }
        }

        /* Encabezado: Nombre e Identificador Visual */
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .avatar-placeholder {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            color: var(--accent);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .client-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* Cuerpo de la tarjeta: Datos ordenados */
        .card-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .data-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .data-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .data-value {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            word-break: break-word;
        }

        /* Fila doble para datos cortos (Código y Cédula) */
        .data-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Botón de Acción Principal (Optimizado para pulgares en móvil) */
        .btn-details {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: #ffffff;
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
            -webkit-tap-highlight-color: transparent; /* Elimina el flash azul nativo en móviles */
        }

        .btn-details:active {
            background-color: var(--accent-hover);
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Tarjeta de Cliente -->
    <article class="client-card">
        
        <div class="card-header">
            <div class="avatar-placeholder" aria-hidden="true">CC</div>
            <h2 class="client-name">Carlos Conrado</h2>
        </div>

        <div class="card-body">
            <!-- Fila doble para optimizar espacio vertical en pantallas pequeñas -->
            <div class="data-grid-2">
                <div class="data-row">
                    <span class="data-label">Código</span>
                    <span class="data-value">#CLI-8492</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Cédula</span>
                    <span class="data-value">001-150993-1002Q</span>
                </div>
            </div>

            <div class="data-row">
                <span class="data-label">Teléfono</span>
                <span class="data-value">+505 8888-8888</span>
            </div>

            <div class="data-row">
                <span class="data-label">Dirección</span>
                <span class="data-value">De la rotonda El Güegüense, 2c. al norte, Managua, Nicaragua</span>
            </div>
        </div>

        <button class="btn-details" type="button">Ver detalles</button>

    </article>

</body>
</html>
