<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Cliente PWA</title>
    <style>
   *{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f4f6f9;
    font-family:Segoe UI,Roboto,sans-serif;
}

.cliente-card{

    width:100%;
    background:#fff;
    border-radius:18px;
    overflow:hidden;

    box-shadow:
        0 8px 24px rgba(0,0,0,.08);

    transition:.25s;
}

.cliente-card:hover{
    transform:translateY(-3px);
}

.cliente-header{

    display:flex;
    align-items:center;
    gap:15px;

    padding:18px;

    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:white;
}

.avatar{

    width:60px;
    height:60px;

    border-radius:50%;

    background:rgba(255,255,255,.25);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
}

.cliente-info{

    flex:1;
}

.cliente-info h2{

    margin:0;
    font-size:20px;
    font-weight:700;
}

.codigo{

    display:block;
    margin-top:4px;

    opacity:.9;
    font-size:13px;
}

.cliente-body{

    padding:18px;
}

.dato{

    display:flex;
    align-items:flex-start;

    gap:14px;

    margin-bottom:18px;
}

.dato:last-child{

    margin-bottom:0;
}

.icono{

    width:42px;
    height:42px;

    border-radius:12px;

    background:#eef5ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.dato small{

    display:block;
    color:#777;
    margin-bottom:3px;
}

.dato strong{

    color:#333;
    font-size:15px;
    line-height:1.4;
}

.cliente-footer{

    padding:18px;
}

.btn-detalle{

    width:100%;

    border:none;

    border-radius:12px;

    background:#1976d2;
    color:white;

    padding:14px;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.btn-detalle:hover{

    background:#1565c0;
}

/* Móviles */

@media (max-width:480px){

    .cliente-info h2{

        font-size:18px;
    }

    .avatar{

        width:50px;
        height:50px;
        font-size:24px;
    }

}
    </style>
</head>
<body>

    <div class="cliente-card">

    <div class="cliente-header">
        <div class="avatar">
            👤
        </div>

        <div class="cliente-info">
            <h2>Juan Carlos Pérez López</h2>
            <span class="codigo">Código #00012548</span>
        </div>
    </div>

    <div class="cliente-body">

        <div class="dato">
            <span class="icono">🪪</span>
            <div>
                <small>Cédula</small>
                <strong>001-010190-1234A</strong>
            </div>
        </div>

        <div class="dato">
            <span class="icono">📍</span>
            <div>
                <small>Dirección</small>
                <strong>Managua, Villa Fontana Sur, Casa #25</strong>
            </div>
        </div>

        <div class="dato">
            <span class="icono">📞</span>
            <div>
                <small>Teléfono</small>
                <strong>8888-9999</strong>
            </div>
        </div>

    </div>

    <div class="cliente-footer">
        <button class="btn-detalle">
            Ver detalles →
        </button>
    </div>

</div>


</body>
</html>
