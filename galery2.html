<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA - Galería con Vista Previa y Nombre</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #3b82f6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 14px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.25rem 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%; 
            max-width: 800px; 
        }

        header {
            margin-bottom: 1.25rem;
        }

        header h2 {
            font-size: 1.35rem;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        /* --- CUADRÍCULA DE 2 COLUMNAS --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 0.85rem;
        }

        /* --- Tarjeta de Imagen (Vista Previa) --- */
        .gallery-item {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Overlay Superior (Botón Eliminar) */
        .item-overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0) 100%);
            display: flex;
            justify-content: flex-end;
            padding: 8px;
            z-index: 2;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.92);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .btn-delete:active {
            transform: scale(0.9);
            background: var(--danger-hover);
        }

        /* Overlay Inferior (Texto / Nombre de Archivo) */
        .item-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(15, 23, 42, 0.92) 15%, rgba(15, 23, 42, 0) 100%);
            padding: 22px 10px 8px 10px;
            z-index: 2;
            pointer-events: none;
        }

        .item-footer span {
            display: block;
            color: var(--text-main);
            font-size: 0.73rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.2px;
        }

        /* --- Tarjeta para Abrir el Menú de Carga --- */
        .upload-card {
            background-color: rgba(30, 41, 59, 0.4);
            border: 2px dashed #475569;
            border-radius: var(--radius);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
            padding: 0.5rem;
            transition: var(--transition);
        }

        .upload-card:active {
            background-color: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
        }

        .upload-icon {
            width: 44px;
            height: 44px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
        }

        .upload-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .upload-subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* --- MENÚ INFERIOR / ACTION SHEET --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .action-sheet {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 1.25rem;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal-overlay.active .action-sheet {
            transform: translateY(0);
        }

        .action-sheet h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sheet-btn {
            width: 100%;
            background: #334155;
            color: var(--text-main);
            border: none;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.6rem;
            cursor: pointer;
        }

        .sheet-btn:active { 
            background: var(--primary); 
        }

        .sheet-btn.cancel { 
            background: transparent; 
            color: var(--danger); 
            margin-top: 0.2rem; 
            justify-content: center; 
        }

        /* Inputs de archivo ocultos */
        input[type="file"] { display: none; }

        /* Animaciones */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .removing {
            animation: popOut 0.25s ease-in forwards;
        }

        @keyframes popOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>Galería PWA (2 Columnas)</h2>
            <p>Selecciona desde tu fototeca o captura directamente con la cámara.</p>
        </header>

        <main class="gallery-grid" id="galleryGrid">
            
            <!-- Tarjeta de Carga (Siempre al final) -->
            <div class="upload-card" id="uploadCard" onclick="openActionSheet()">
                <div>
                    <div class="upload-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </div>
                    <span class="upload-title">Agregar foto</span>
                    <p class="upload-subtitle">Cámara o Galería</p>
                </div>
            </div>

        </main>
    </div>

    <!-- INPUTS OCULTOS DE HTML5 -->
    <!-- 1. Toma foto directo desde la cámara trasera -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFiles(this.files)">

    <!-- 2. Abre la galería del celular (múltiple selección) -->
    <input type="file" id="galleryInput" accept="image/*" multiple onchange="handleFiles(this.files)">

    <!-- ACTION SHEET / MENÚ DESPLEGABLE MÓVIL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeActionSheet(event)">
        <div class="action-sheet">
            <h3>Origen de la imagen</h3>
            
            <button class="sheet-btn" onclick="triggerInput('cameraInput')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Tomar Fotografía
            </button>
            
            <button class="sheet-btn" onclick="triggerInput('galleryInput')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Seleccionar de la Galería
            </button>

            <button class="sheet-btn cancel" onclick="forceCloseSheet()">Cancelar</button>
        </div>
    </div>

    <script>
        const galleryGrid = document.getElementById('galleryGrid');
        const uploadCard = document.getElementById('uploadCard');
        const modalOverlay = document.getElementById('modalOverlay');

        function openActionSheet() {
            modalOverlay.classList.add('active');
        }

        function forceCloseSheet() {
            modalOverlay.classList.remove('active');
        }

        function closeActionSheet(e) {
            if (e.target === modalOverlay) forceCloseSheet();
        }

        function triggerInput(inputId) {
            forceCloseSheet();
            document.getElementById(inputId).click();
        }

        function deleteItem(btn) {
            const card = btn.closest('.gallery-item');
            card.classList.add('removing');
            card.addEventListener('animationend', () => {
                card.remove();
            });
        }

        function handleFiles(files) {
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const newItem = document.createElement('div');
                    newItem.className = 'gallery-item';
                    newItem.innerHTML = `
                        <img src="${e.target.result}" alt="${file.name}">
                        
                        <!-- Botón eliminar arriba -->
                        <div class="item-overlay-top">
                            <button class="btn-delete" title="Eliminar imagen" onclick="deleteItem(this)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>

                        <!-- Nombre de la imagen abajo -->
                        <div class="item-footer" title="${file.name}">
                            <span>${file.name}</span>
                        </div>
                    `;
                    galleryGrid.insertBefore(newItem, uploadCard);
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('cameraInput').value = '';
            document.getElementById('galleryInput').value = '';
        }
    </script>
</body>
</html>
